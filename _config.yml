baseurl: ''
exclude:
  - README.md
  - vendor
  - .bundle
permalink: pretty
title: 'Banyan Advisory'
description: 'Investment banking advisory for private equity syndication, mergers and acquisitions, investor relations, and strategic finance.'

collections:
  services:
    output: true
    permalink: /services/:path/
  team:
    output: true
    permalink: /team/:path/
  transactions:
    output: true
    permalink: /transactions/:path/

defaults:
  - scope:
      type: services
    values:
      layout: service
      bodyClass: page-services-single
  - scope:
      path: 'images'
    values:
      image: true

sass:
  style: compact # possible values: nested expanded compact compressed

google_analytics_id: null

plugins:
  - jekyll-environment-variables
